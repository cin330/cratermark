name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting and types
        run: |
          moon update
          moon fmt --check
          moon check -d
      - name: Verify generated interfaces are current
        run: |
          moon info
          git diff --exit-code
      - name: Test library backends
        run: |
          moon test --target wasm -d
          moon test --target native -d
      - name: Build native CLI
        run: moon build --target native
      - name: Check repository documentation graph
        run: moon run cmd/cratermark check .
      - name: Check example workspace
        run: moon run cmd/cratermark check examples/workspace
      - name: Generate CraterMark SARIF
        if: matrix.os == 'ubuntu-latest'
        run: moon run cmd/cratermark scan . --format sarif --output cratermark.sarif
      - name: Upload CraterMark results to code scanning
        if: |
          matrix.os == 'ubuntu-latest' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cratermark.sarif
          category: cratermark/documentation
