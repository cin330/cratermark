name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting and types
        run: |
          moon update
          moon fmt --check
          moon check -d
      - name: Test library backends
        run: |
          moon test --target wasm
          moon test --target native
      - name: Build native CLI
        run: moon build --target native
      - name: Check repository documentation graph
        run: moon run cmd/cratermark check .
      - name: Generate CraterMark SARIF
        run: moon run cmd/cratermark scan . --format sarif --output cratermark.sarif
      - name: Upload CraterMark results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cratermark.sarif
          category: cratermark/documentation
